; Cardputer_WaveLooper v0.1 - USB audio (UAC1 device) looper for M5Stack Cardputer-Adv
; Arduino 3.3.x (IDF 5.x) is required for USBAudioCard.
[env:cardputer_wavelooper]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
    -Wl,--wrap=dcd_edpt_iso_activate
    -Wl,--wrap=tinyusb_enable_interface

build_src_flags =
    -O3

lib_deps =
    m5stack/M5GFX
    m5stack/M5Unified
    m5stack/M5Cardputer
